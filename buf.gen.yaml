version: v2
inputs:
  - directory: proto
plugins:
  - local: [go, tool, protoc-gen-go]
    out: backend/gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: backend/gen
    opt: paths=source_relative
  - local: packages/api-client/node_modules/.bin/protoc-gen-es
    out: packages/api-client/src/gen
    opt: target=ts
