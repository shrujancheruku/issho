version: v2
# The Go package of each file is set here, so the .proto files stay free of
# language options.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/shrujancheruku/issho/backend/gen
inputs:
  - directory: proto
plugins:
  - local: [go, tool, protoc-gen-go]
    out: backend/gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: backend/gen
    opt: paths=source_relative
  # Installed by `make setup` (pnpm install); the path avoids a pnpm wrapper
  # that could print into the plugin's output.
  - local: packages/api-client/node_modules/.bin/protoc-gen-es
    out: packages/api-client/src/gen
    opt: target=ts
