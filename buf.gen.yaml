version: v2
inputs:
  - directory: proto
plugins:
  - local: [go, tool, protoc-gen-go]
    out: backend/gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: backend/gen
    opt: paths=source_relative
  - local: packages/api-client/node_modules/.bin/protoc-gen-es
    out: packages/api-client/src/gen
    opt: target=ts
    # The generated files import buf/validate/validate_pb (for the limit rules),
    # which lives in the protovalidate dependency, so generate it too.
    include_imports: true
  # API reference generated from proto comments; CI fails if it is stale.
  - local: [go, tool, protoc-gen-doc]
    out: docs/generated
    opt: markdown,api.md
    strategy: all
