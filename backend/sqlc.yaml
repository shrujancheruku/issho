version: "2"
sql:
  - engine: postgresql
    # sqlc reads the goose migrations as the schema; it stops at each `-- +goose Down`.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: gen/dbgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
