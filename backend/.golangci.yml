# golangci-lint v2. Run with `go tool golangci-lint run` (pinned in go.mod's
# tool block); `make lint` and CI's "Lint" step both do. See backend/README.md.
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Wrapped errors (pgx, River, Connect, context) break == and type
    # assertions; require errors.Is/As and %w.
    - errorlint
    # HTTP response bodies must be closed or connections leak.
    - bodyclose
    # Outbound HTTP requests carry the caller's context so cancellation and
    # deadlines reach them.
    - noctx
    # Every //nolint names its linter and says why.
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    # Generated code: protobuf/Connect (gen/issho) and sqlc (gen/dbgen).
    generated: strict
    paths:
      - gen
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
    paths:
      - gen
