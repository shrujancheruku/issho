# golangci-lint v2. Run with `go tool golangci-lint run` (pinned in go.mod's
# tool block); `make lint` and CI's "Lint" step both do. See backend/README.md.
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Wrapped errors (pgx, River, Connect, context) break == and type
    # assertions; require errors.Is/As and %w.
    - errorlint
    # HTTP response bodies must be closed or connections leak.
    - bodyclose
    # Outbound HTTP requests carry the caller's context so cancellation and
    # deadlines reach them.
    - noctx
    # A rows loop that stops early on error must not read as success; check
    # rows.Err() after iterating (the pgx package is set below).
    - rowserrcheck
    # Rows (pgx included) must be closed or the pooled connection stays busy.
    - sqlclosecheck
    # `return nil` inside `if err != nil` swallows the error; make deliberate
    # cases explicit.
    - nilerr
    # A function that has a ctx passes it on, so cancellation and deadlines
    # reach the work it starts.
    - contextcheck
    # Security smells: unbounded reads, loose file modes, missing server
    # timeouts, SQL built by string. Rules that don't fit are excluded below.
    - gosec
    # Typos in comments and strings.
    - misspell
    # Every //nolint names its linter and says why.
    - nolintlint
  settings:
    rowserrcheck:
      # Defaults to database/sql and sqlx, but the backend uses pgx v5 only.
      packages:
        - github.com/jackc/pgx/v5
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        # int -> int32/int16 conversions: wire fields are int32 and the
        # columns smallint, and the values are small by domain (page sizes,
        # ratings, counts, enums), validated at the edge. 73 hits.
        - G115
  exclusions:
    # Generated code: protobuf/Connect (gen/issho) and sqlc (gen/dbgen).
    generated: strict
    paths:
      - gen
    rules:
      # Operator tooling and the offline benchmark/simulator run on a
      # developer's machine with paths and flags they supply; they write
      # files meant for the repo (0644) and use math/rand for reproducible
      # simulation, not secrets. The API server is still checked.
      - linters: [gosec]
        path: ^(cmd/tool|internal/walks/bench|internal/matching/sim)/
        text: "G(203|204|301|302|304|306|404|703):"
      # These read a file whose path cmd/tool takes from the operator.
      - linters: [gosec]
        path: ^internal/(cities/pack|emailtemplates/emailtemplates)\.go$
        text: "G304:"
      # Tests write fixtures to t.TempDir(), index slices they just built and
      # use fake credentials as sample data.
      - linters: [gosec]
        path: _test\.go$
        text: "G(101|301|304|306|602|703):"
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
    paths:
      - gen
