<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title">
  <title id="title">Example plans: Tokyo, photo walk from Kichijoji station, ending at a café we've already picked. London, flower market wander on Columbia Road, then a Sunday roast at the pub. Mexico City, bike ride down car-free Reforma, then tacos al pastor in Roma. Melbourne, coffee crawl through the CBD laneways, ending at Queen Victoria Market. Buenos Aires, antique hunting at the San Telmo fair, then empanadas on Plaza Dorrego. Cape Town, sunrise hike up Lion's Head, then breakfast together in Sea Point.</title>
  <!-- Colours and the thread-and-sun motif follow the site (site/index.html): bg #161616, line #302e29, text #f4f0e6, muted #b3ad9e, gold #C9A227, red #BC002D. System fonts only: GitHub serves SVGs as images, which can't load web fonts. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .caption { font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #C9A227; }
    .city { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #f4f0e6; }
    .plan { font-size: 19px; fill: #b3ad9e; }
    .act { font-weight: 700; fill: #C9A227; }
  </style>

  <rect x="1" y="1" width="938" height="418" rx="20" fill="#161616" stroke="#302e29" stroke-width="2"/>
  <text class="caption" x="40" y="52">PLANS LIKE</text>

  <!-- The thread joins the suns centre to centre. -->
  <line x1="48" y1="98" x2="48" y2="373" stroke="#C9A227" stroke-width="2"/>
  <g fill="#BC002D" stroke="#161616" stroke-width="3">
    <circle cx="48" cy="98" r="8"/>
    <circle cx="48" cy="153" r="8"/>
    <circle cx="48" cy="208" r="8"/>
    <circle cx="48" cy="263" r="8"/>
    <circle cx="48" cy="318" r="8"/>
    <circle cx="48" cy="373" r="8"/>
  </g>

  <text class="city" x="76" y="103">TOKYO</text>
  <text class="plan" x="226" y="104"><tspan class="act">Photo walk</tspan> from Kichijoji station, ending at a café we've already picked.</text>

  <text class="city" x="76" y="158">LONDON</text>
  <text class="plan" x="226" y="159"><tspan class="act">Flower market</tspan> wander on Columbia Road, then a <tspan class="act">Sunday roast</tspan> at the pub.</text>

  <text class="city" x="76" y="213">MEXICO CITY</text>
  <text class="plan" x="226" y="214"><tspan class="act">Bike ride</tspan> down car-free Reforma, then <tspan class="act">tacos al pastor</tspan> in Roma.</text>

  <text class="city" x="76" y="268">MELBOURNE</text>
  <text class="plan" x="226" y="269"><tspan class="act">Coffee crawl</tspan> through the CBD laneways, ending at Queen Victoria Market.</text>

  <text class="city" x="76" y="323">BUENOS AIRES</text>
  <text class="plan" x="226" y="324"><tspan class="act">Antique hunting</tspan> at the San Telmo fair, then <tspan class="act">empanadas</tspan> on Plaza Dorrego.</text>

  <text class="city" x="76" y="378">CAPE TOWN</text>
  <text class="plan" x="226" y="379"><tspan class="act">Sunrise hike</tspan> up Lion's Head, then <tspan class="act">breakfast</tspan> together in Sea Point.</text>
</svg>
