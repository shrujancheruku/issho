<!-- Issho sign-in code. The app asks for this 6-digit code (no links: links can't open the native app reliably). -->
<div style="font-family: -apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #111111;">
  <p style="font-size: 18px; margin: 0 0 16px;">Your Issho sign-in code / Issho のログインコード</p>
  <p style="font-size: 36px; letter-spacing: 8px; font-weight: 700; margin: 0 0 16px; color: #BC002D;">{{ .Token }}</p>
  <p style="font-size: 14px; color: #555555; margin: 0;">This code expires in 10 minutes. If you didn't request it, you can ignore this email.<br>このコードの有効期限は10分です。心当たりがない場合は無視してください。</p>
</div>
