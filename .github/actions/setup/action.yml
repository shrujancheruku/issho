name: setup
description: The toolchains a CI job needs, so each job lists only what it uses.

inputs:
  go:
    description: Install Go (the version in backend/go.mod) with its caches.
    default: "false"
  node:
    description: Install pnpm and Node, then the workspace's packages from the lockfile.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      if: inputs.go == 'true'
      with:
        go-version-file: backend/go.mod
        # The tools (buf, gitleaks, actionlint) build from tools/go.sum.
        cache-dependency-path: |
          backend/go.sum
          tools/go.sum
    # The pnpm version is the root package.json's packageManager.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      if: inputs.node == 'true'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.node == 'true'
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      if: inputs.node == 'true'
      shell: bash
