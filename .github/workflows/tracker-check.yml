name: tracker-check

# Weekly check that the issue tracker follows its rules (#435): triage labels,
# ROADMAP references, merged PRs that close nothing, parents and sizes, PR-only
# labels. The rules are in docs/agents/issue-tracker.md; the logic is in
# scripts/tracker-check.sh, which `make tracker-check` runs too.
#
# A failing run is the signal: the offending issues are listed in the log and the
# job summary. Run it on demand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# Read-only: the default GITHUB_TOKEN is all it needs.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  tracker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tracker check
        env:
          GH_TOKEN: ${{ github.token }}
        run: make tracker-check
