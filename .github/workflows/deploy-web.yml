name: deploy-web

# Deploys the Cloudflare Workers when they change on main: the admin SPA
# (issho-admin) and the app's web build (issho-web) with scripts/deploy-web.sh,
# and the marketing site (issho-site, site/wrangler.jsonc, joinissho.com).
# Each job only runs when its own files changed since the last successful run
# of this workflow, and only after the ci workflow passed on the same commit
# (workflow_run.head_sha, which is what gets built; a failed CI run leaves
# everything skipped and its changes ride along with the next green commit).
# A manual run deploys everything.
#
# Configured 2026-10-26 (Settings → Secrets and variables → Actions):
#   variable API_URL                 https://api.joinissho.com
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#            EXPO_PUBLIC_GOOGLE_MAPS_WEB_API_KEY   (public values)
#   secret   CLOUDFLARE_API_TOKEN    scoped to Workers Scripts: Edit
# Without API_URL the apps job is skipped, not failed.

# The run's title records the commit it deployed. The run's own head_sha is
# main's tip when the run was created, not workflow_run.head_sha, so it can't
# say what was deployed; changes reads this title back from the last run
# whose job for each target succeeded instead.
run-name: deploy ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gh run list, to find the last successful deploy.
  actions: read

env:
  # The commit to deploy: the one CI tested (a manual run uses its own).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # What changed, so a site-only push doesn't rebuild the apps and vice versa.
  changes:
    # Only after a green ci run on a push to main (the event check keeps a
    # fork's pull request from a branch named main out), or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "deploying $SHA"
          # A manual run deploys everything.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"; echo "apps=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Out-of-order finish: if main has moved on, a newer commit's run
          # deploys this one too (it diffs against the same bases). Without
          # this, CI finish order would decide deploy order and an older
          # commit could replace a newer one.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "main has moved on; the newer run deploys this"
            echo "site=false" >> "$GITHUB_OUTPUT"; echo "apps=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The last commit a deploy job actually deployed, not the parent and
          # not just the last successful run: runs for red CI are skipped, a
          # run that skipped because main moved on or because the target isn't
          # configured still concludes success, and none of those deployed
          # anything. So walk the recent successful runs and take the first
          # whose deploy job (arg 2) succeeded. The commit comes from the run
          # title (run-name above), since the run's own head_sha isn't the
          # deployed one. An old-format title (the first run after this
          # change) isn't parsable and counts as no earlier deploy.
          last_deployed() {
            gh run list --workflow "$1" --branch main --status success --limit 20 \
              --json databaseId,displayTitle --jq '.[] | "\(.databaseId) \(.displayTitle)"' |
            while read -r id title; do
              sha=$(echo "$title" | sed -n 's/^deploy \([0-9a-f]\{40\}\)$/\1/p')
              [ -n "$sha" ] || continue
              job=$(gh run view "$id" --json jobs --jq "[.jobs[] | select(.name == \"$2\") | .conclusion][0]")
              if [ "$job" = success ]; then echo "$sha"; break; fi
            done || true  # gh may get SIGPIPE after the break; pipefail would abort
          }
          # Has anything under the pattern changed since the target's last
          # deploy? No earlier deploy, or one no longer in the history: yes.
          changed() {
            base=$(last_deployed "$1" "$2")
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "$2: no earlier deploy to diff against; deploying" >&2; echo true; return
            fi
            echo "$2: last deployed $base" >&2
            files=$(git diff --name-only "$base" "$SHA")  # not piped into grep -q: SIGPIPE under pipefail
            echo "$files" | grep -qE "$3" && echo true || echo false
          }
          # Each target against its own last deploy: its job is "site" or
          # "deploy" (the apps).
          echo "site=$(changed deploy-web.yml site '^(site/|\.github/workflows/deploy-web\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "apps=$(changed deploy-web.yml deploy '^(apps/admin/|apps/mobile/|packages/|pnpm-lock\.yaml$|scripts/deploy-web\.sh$|\.github/workflows/deploy-web\.yml$)')" >> "$GITHUB_OUTPUT"

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The site is plain files: no install or build, just publish the folder.
      - name: Deploy the marketing site
        working-directory: site
        run: npx --yes wrangler@4.150.0 deploy  # the admin's version (apps/admin/package.json)
      - name: Site answers
        run: curl -fsS -o /dev/null https://joinissho.com/

  deploy:
    needs: changes
    if: needs.changes.outputs.apps == 'true' && vars.API_URL != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_WEB_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_WEB_API_KEY }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Configured
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::API_URL is set but these aren't:$missing"; exit 1; fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy both sites
        run: scripts/deploy-web.sh "$API_URL"
      - name: Sites answer
        run: |
          curl -fsS -o /dev/null https://admin.joinissho.com/
          curl -fsS -o /dev/null https://app.joinissho.com/
