name: release-please

# On every push to main, release-please reads the Conventional Commits since the
# last tag and keeps a release PR open with the next SemVer version and changelog.
# Merging that PR tags vX.Y.Z and publishes a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
