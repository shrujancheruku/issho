name: release-please

# On every push to main, release-please reads the Conventional Commits since the
# last tag and keeps a release PR open with the next SemVer version and changelog.
# Merging that PR tags vX.Y.Z and publishes a GitHub release.
on:
  push:
    branches: [main]
  # Manual re-run from the Actions tab (e.g. after changing repo permissions).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prs_created: ${{ steps.rp.outputs.prs_created }}
      branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # PRs opened or pushed with GITHUB_TOKEN don't trigger workflows, so the
  # release PR would never get CI. GITHUB_TOKEN may start a workflow_dispatch,
  # so run ci.yml on the release branch: its checks attach to the PR's head
  # commit. No PAT or App. This can't deploy or release by itself: ci.yml only
  # tests, and the deploy workflows act only on a `push` CI run on main.
  ci-for-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.release-please.outputs.branch }}
