name: trial-605

# TEMPORARY, #605 only, deleted before the ticket is reported done. The parts of
# the dev deploy that need no VM, run for real: the images build and push, and the
# migration runs against issho-dev. A canary step after it shows whether a failed
# migration stopped what follows.
on:
  push:
    branches:
      - shrujancheruku/605-dev-deploy

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: trial-605
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: "true", node: "true" }
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/94737271594/locations/global/workloadIdentityPools/github/providers/issho
          service_account: issho-deploy@issho-dev-512213.iam.gserviceaccount.com
      - run: gcloud auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
      - run: sudo gem install kamal --no-document --version "$(cat config/kamal-version)"
      - name: Build and push the images
        env:
          # Kamal needs a host to load its config; nothing connects to it.
          DEPLOY_HOST: 203.0.113.1
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kamal build push -d dev
          kamal build push -c config/deploy.web.yml -d dev
      - name: Migrate issho-dev
        run: |
          url=$(gcloud secrets versions access latest --secret=dev-migrate-database-url --project=issho-dev-512213 | tr -d '\r')
          echo "::add-mask::$url"
          cd backend && DATABASE_URL="$url" go run ./cmd/migrate up
      - name: Canary (runs only if the migration succeeded)
        run: echo "CANARY REACHED, the step after the migration ran"
