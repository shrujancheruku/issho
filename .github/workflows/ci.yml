name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every push/PR that changes code must also update docs/ROADMAP.md.
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Roadmap updated with this change
        run: scripts/check-roadmap.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

  # Scans every commit in the push/PR for secrets (see .gitleaks.toml). Runs on
  # every event because the repo is public: a leaked key must fail loudly.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make secrets-scan

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # Proto checks and codegen drift. Kept apart from `backend` because only this
  # needs Node (protoc-gen-es), and the two jobs then run side by side.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Proto lint
        run: go tool buf lint proto
      - name: Proto breaking changes
        if: github.event_name == 'pull_request'
        run: go tool buf breaking proto --against '.git#branch=origin/main,subdir=proto'
      - name: Generated code is up to date
        run: make gen && git diff --exit-code

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      # Not a service container: those are pulled and health-checked before the
      # first step, which blocked the job for ~20s. Started in the background,
      # the pull overlaps with Go setup; "Wait for PostGIS" joins it before the
      # first step that needs the database.
      - name: Start PostGIS in the background
        run: |
          nohup docker run -d --name postgis -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30 \
            postgis/postgis:17-3.5 > "$RUNNER_TEMP/postgis.log" 2>&1 &
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet and test
        working-directory: backend
        run: go vet ./... && go test ./...
      - name: Wait for PostGIS
        run: |
          for _ in $(seq 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgis 2>/dev/null)" = healthy ] && exit 0
            sleep 1
          done
          echo "PostGIS not healthy after 90s"; cat "$RUNNER_TEMP/postgis.log"; docker logs postgis || true
          exit 1
      - name: Migrations apply, roll back and re-apply; seed loads
        working-directory: backend
        run: |
          go run ./cmd/tool migrate up
          go run ./cmd/tool migrate down
          go run ./cmd/tool migrate up
          go run ./cmd/tool seed ../data/citypacks/tokyo.json ../data/citypacks/austin.json
      - name: DB integration tests and tool dry-runs (no Google calls)
        working-directory: backend
        run: |
          TEST_DATABASE_URL="$DATABASE_URL" go test ./internal/geo/ ./internal/profile/ -run Integration -v
          go run ./cmd/tool build-matrix -dry-run tokyo
          go run ./cmd/tool discover-venues -dry-run austin
      - name: Migration bookkeeping stays out of the public schema
        # Supabase's Data API exposes public tables to anonymous clients; see internal/platform/db.
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select to_regclass('goose.db_version') is not null and to_regclass('public.app_goose_db_version') is null")" = t

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Web build exports (not released yet; keeps it from breaking)
        working-directory: apps/mobile
        run: pnpm export:web --output-dir "$RUNNER_TEMP/web"
