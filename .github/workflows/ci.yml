name: ci

on:
  push:
    branches: [main]
  # labeled/unlabeled re-run CI so adding or removing `breaking-ok` updates
  # the proto-breaking result.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Dispatched by release-please.yml on the release PR's branch: PRs opened
  # with GITHUB_TOKEN don't trigger workflows, so without this the release PR
  # would never get its required checks. Deploys ignore it: they run only for
  # a `push` CI run (deploy-*.yml check workflow_run.event).
  workflow_dispatch:

# A newer push to a PR cancels its older run. Runs on main always finish,
# because deploys wait for them: each push run gets its own group (by SHA),
# since GitHub drops a *queued* run when a newer one joins the same group, even
# with cancel-in-progress off. A dispatched run is keyed by its branch.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No Turbo cache (checked 2026-11): it would save about 20s off `typescript`,
# which isn't the slowest job, and a cache hit could skip a check when an input
# turbo.json doesn't declare changed. Not worth that risk.

jobs:
  # Every push/PR that changes code must also update docs/ROADMAP.md.
  roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Roadmap updated with this change
        # A dispatch has no event base: compare with where the branch left main.
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            workflow_dispatch) git fetch --no-tags origin main && base=$(git merge-base origin/main HEAD) ;;
            *) base="$BEFORE" ;;
          esac
          scripts/check-roadmap.sh "$base"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}

  # Scans every commit in the push/PR for secrets (see .gitleaks.toml). Runs on
  # every event because the repo is public: a leaked key must fail loudly.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make secrets-scan

  # On a dispatch (the release PR) there is no PR event, so lint the commits
  # since main by hand rather than rely on a skipped required check counting
  # as passed.
  commits:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        if: github.event_name == 'pull_request'
        with:
          configFile: commitlint.config.mjs
      - uses: pnpm/action-setup@v6
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'workflow_dispatch'
      - run: git fetch --no-tags origin main && pnpm exec commitlint --config commitlint.config.mjs --from "$(git merge-base origin/main HEAD)" --to HEAD
        if: github.event_name == 'workflow_dispatch'

  # Proto checks and codegen drift. Kept apart from `backend` because only this
  # needs Node (protoc-gen-es), and the two jobs then run side by side.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      # One Go cache per job instead of setup-go's shared one. Building buf and
      # sqlc fills ~2.4 GB (464 MB compressed); backend never runs them, and
      # its own cache is 68 MB. Go needs every archive and module zip to treat
      # a cached tool binary as up to date, so this cache can't be trimmed.
      # An exact key hit is never saved again, so whatever was built when the
      # key was first written is all the cache will ever hold. The key was once
      # written before `make gen` built the backend's own dependencies
      # (gen-strings), and for weeks every run recompiled them and re-downloaded
      # modules (codegen 2m20s, backend 1m05s). Bump the `v` when a generator
      # starts building something the cache doesn't hold. go.mod is in the key
      # because `tool` directives live there.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-codegen-v2-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
          restore-keys: go-${{ runner.os }}-codegen-v2-
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Proto lint
        run: go tool buf lint proto
      - name: Generated code is up to date
        run: make gen && git diff --exit-code

  # buf breaking, apart from `codegen` so a failure here doesn't skip the drift
  # check there. NOT a required check: the `breaking-ok` label skips it (a
  # deliberate override), and an unlabeled breaking PR still shows it red.
  # Same Go cache key as codegen but restore-only, so it adds no save step and
  # finishes well before codegen. Needs only Go (no Node, no generators).
  proto-breaking:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'breaking-ok')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-codegen-v2-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}
          restore-keys: go-${{ runner.os }}-codegen-v2-
      - run: go tool buf breaking proto --against '.git#branch=origin/main,subdir=proto'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      # Not a service container: those are pulled and health-checked before the
      # first step, which blocked the job for ~20s. Started in the background,
      # the pull overlaps with Go setup; "Wait for PostGIS" joins it before the
      # first step that needs the database.
      # The health check goes over TCP (-h 127.0.0.1): the image's init scripts
      # (creating PostGIS) run on a temporary server that listens only on the
      # Unix socket, so a socket check reports healthy before that server stops.
      # Supabase's own Postgres image, the tag the Supabase CLI runs (`supabase
      # --version` 3.0.0 pins 17.11.0.011), so CI matches hosted Supabase: a
      # non-superuser `postgres`, the `extensions` schema on its search_path, the
      # same PostGIS. Keep it in step with the CLI; scripts/test-db.sh reads it
      # from here. Multi-arch, so `make test-db` runs natively on Apple silicon.
      - name: Start PostGIS in the background
        run: |
          nohup docker run -d --name postgis -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30 \
            public.ecr.aws/supabase/postgres:17.11.0.011 > "$RUNNER_TEMP/postgis.log" 2>&1 &
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      # Per-job Go cache: see the codegen job.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-backend-${{ hashFiles('backend/go.sum') }}
          restore-keys: go-${{ runner.os }}-backend-
      # Integration tests are skipped here (the database isn't up yet, and CI=true
      # makes them fail rather than skip); "Database checks" runs them.
      - name: Vet and test
        working-directory: backend
        run: go vet ./... && go test ./... -skip Integration
      - name: Wait for PostGIS
        run: |
          for _ in $(seq 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgis 2>/dev/null)" = healthy ] && exit 0
            sleep 1
          done
          echo "PostGIS not healthy after 90s"; cat "$RUNNER_TEMP/postgis.log"; docker logs postgis || true
          exit 1
      # Migrations up/down/up, seed, DB integration tests and tool dry-runs: one
      # script, shared with `make test-db`.
      - name: Database checks
        run: scripts/db-checks.sh
      - name: Migration bookkeeping stays out of the public schema
        # Supabase's Data API exposes public tables to anonymous clients; see internal/platform/db.
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select to_regclass('goose.db_version') is not null and to_regclass('public.app_goose_db_version') is null")" = t

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One turbo run so the three tasks run in parallel; turbo prefixes each line with its task.
      - name: DIAG jest
        working-directory: apps/mobile
        run: |
          nproc; free -m
          stamp() { while IFS= read -r l; do printf '%s %s\n' "$(date +%T.%N | cut -c1-12)" "$l"; done; }
          date +%T
          pnpm exec jest --ci --silent --detectOpenHandles 2>&1 | grep -E "^(PASS|FAIL|Tests|Test Suites|Time|Jest|A worker)|open handle" | stamp
          date +%T
      - name: Admin SPA builds
        run: pnpm --filter @issho/admin build
      # Metro's transform cache (~10 MB; Expo's default location is $TMPDIR/metro-cache).
      # A cold web bundle took ~24s, a warm one ~3s. Entries are keyed by file
      # content, so a stale cache only costs re-transforms. Saved per commit
      # but restored only within the same lockfile, so dependency updates
      # start clean instead of piling up unused entries.
      - uses: actions/cache@v6
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Web build exports (not released yet; keeps it from breaking)
        working-directory: apps/mobile
        run: pnpm export:web --output-dir "$RUNNER_TEMP/web"

  # The deploy image (backend/Dockerfile, shipped by Kamal in M9) keeps
  # building, and its binaries start. Not pushed anywhere.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build record artifact and job summary aren't read by anyone.
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          # Skips stopping and removing the buildx builder container after the
          # job (~25s). GitHub-hosted runners are discarded after each job, so
          # nothing is left behind; on a self-hosted runner, builders would pile up.
          cleanup: false
      # GitHub's cache (cache-from/cache-to below) keeps the image layers, so
      # an unchanged backend skips the Go build. It can't hold the
      # Dockerfile's cache mounts, so when Go code changes, the modules and
      # compiled packages come from actions/cache instead: cache-dance copies
      # them into the builder before the build and back out afterwards.
      # Keyed on go.sum like the other Go caches: dependencies are the slow
      # part, and our own packages recompile in seconds. Saved once per go.sum.
      - uses: actions/cache@v6
        id: go-cache
        with:
          path: |
            buildkit-cache/go-mod
            buildkit-cache/go-build
          key: go-${{ runner.os }}-image-${{ hashFiles('backend/go.sum') }}
          restore-keys: go-${{ runner.os }}-image-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          # Paths must match the cache mounts in backend/Dockerfile.
          cache-map: |
            {
              "buildkit-cache/go-mod": "/go/pkg/mod",
              "buildkit-cache/go-build": "/root/.cache/go-build"
            }
          # Copying the caches back out is only worth it when actions/cache
          # will save them, i.e. on a miss.
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
      # No VERSION build arg: the commit SHA changed the Go build step's cache
      # key on every commit, so even docs-only changes recompiled (~40s). This
      # image is never shipped; Kamal stamps the version on real builds.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          tags: issho-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Binaries start (and stop on missing config)
        run: |
          docker run --rm issho-backend:ci api 2>&1 | tee /dev/stderr | grep -q "DATABASE_URL is required"
          docker run --rm issho-backend:ci worker 2>&1 | tee /dev/stderr | grep -q "DATABASE_URL is required"
