syntax = "proto3";

package issho.v1;

option go_package = "github.com/shrujancheruku/issho/backend/gen/issho/v1;isshov1";

// ErrorReasonDetail rides on a Connect error as a detail (not a service
// message). It names why a call was refused when a screen branches on the
// reason or words it differently; the Connect code and message stay as they
// were, so builds that ignore the detail keep working. Clients read it with
// errorReason() in @issho/api-client.
message ErrorReasonDetail {
  ErrorReason reason = 1;
}

// ErrorReason is added to only when a screen needs the distinction.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // The account is suspended (PERMISSION_DENIED).
  ERROR_REASON_SUSPENDED = 1;
  // The caller hasn't made a profile yet (FAILED_PRECONDITION).
  ERROR_REASON_NO_PROFILE = 2;
  // The event is cancelled or over (FAILED_PRECONDITION).
  ERROR_REASON_EVENT_OVER = 3;
  // Too late to respond (FAILED_PRECONDITION).
  ERROR_REASON_TOO_LATE = 4;
  // Check-in isn't open yet, or the answer doesn't apply now (FAILED_PRECONDITION).
  ERROR_REASON_NOT_NOW = 5;
  // Check-in is closed (FAILED_PRECONDITION).
  ERROR_REASON_CHECK_IN_CLOSED = 6;
  // Feedback isn't open (FAILED_PRECONDITION).
  ERROR_REASON_FEEDBACK_CLOSED = 7;
  // The feature isn't set up on this server, e.g. suggestions without a model
  // key (FAILED_PRECONDITION).
  ERROR_REASON_FEATURE_UNAVAILABLE = 8;
  // An outside call or a background job ran past its time limit; asking again
  // may work (UNAVAILABLE for a call).
  ERROR_REASON_TIMED_OUT = 9;
}
