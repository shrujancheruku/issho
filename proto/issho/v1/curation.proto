syntax = "proto3";

package issho.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/shrujancheruku/issho/backend/gen/issho/v1;isshov1";

// CurationService: venue curation in the admin SPA (M8). Discovery keeps
// every place whose primary type fits a venue category, which lets through
// some that don't suit a group outing (Japanese snack bars are typed
// `bar`). Admins approve or reject places, look for places by name (to
// find the snack bars, or a place discovery missed) and add them. A city
// can be set to use only approved venues.
// Curation applies to a place as a whole, in all its categories. Names and
// addresses come live from Google, in English, and are never stored.
// Admins only, like ModerationService: anyone else gets PERMISSION_DENIED.
//
// HTTP: POST /issho.v1.CurationService/<Method>
service CurationService {
  // ListVenueCities returns every city with its switch and how many
  // places are in each status, and the venue categories.
  rpc ListVenueCities(ListVenueCitiesRequest) returns (ListVenueCitiesResponse) {}

  // SetApprovedVenuesOnly turns the switch on or off. On, the matcher
  // uses only approved venues in the city, for new plans and to decide
  // which plans are possible; plans already made keep their venues.
  rpc SetApprovedVenuesOnly(SetApprovedVenuesOnlyRequest) returns (SetApprovedVenuesOnlyResponse) {}

  // ListVenues returns a city's places in one status, 50 at a time.
  rpc ListVenues(ListVenuesRequest) returns (ListVenuesResponse) {}

  // SetVenueStatus approves, rejects or resets (to candidate) up to 100
  // places of a city. A rejected place is never picked again; plans that
  // already use it keep it (withdraw them on the Plans page).
  rpc SetVenueStatus(SetVenueStatusRequest) returns (SetVenueStatusResponse) {}

  // SearchVenues looks places up by name with Google, in one area or each
  // area of the city (one search per area), and says which the city
  // already has. FAILED_PRECONDITION without a Google Maps key.
  rpc SearchVenues(SearchVenuesRequest) returns (SearchVenuesResponse) {}

  // AddVenue adds a place, approved, in one category. Its Google types
  // must include one of the category's, and it must be within the
  // category's search radius of one of the city's areas (it's put in the
  // nearest). INVALID_ARGUMENT otherwise, or if it's closed.
  rpc AddVenue(AddVenueRequest) returns (AddVenueResponse) {}
}

message ListVenueCitiesRequest {}

message ListVenueCitiesResponse {
  repeated VenueCity cities = 1;
  repeated VenueCategory categories = 2;
}

message VenueCity {
  string id = 1;
  // English name.
  string name = 2;
  bool approved_venues_only = 3;
  // Places, not rows: a place in two categories counts once.
  int32 candidates = 4;
  int32 approved = 5;
  int32 rejected = 6;
  repeated VenueArea areas = 7;
}

message VenueArea {
  string id = 1;
  // English name.
  string name = 2;
}

message VenueCategory {
  string id = 1;
  // English name.
  string name = 2;
}

enum VenueStatus {
  VENUE_STATUS_UNSPECIFIED = 0;
  VENUE_STATUS_CANDIDATE = 1;
  VENUE_STATUS_APPROVED = 2;
  VENUE_STATUS_REJECTED = 3;
}

message SetApprovedVenuesOnlyRequest {
  string city_id = 1;
  bool approved_venues_only = 2;
}

message SetApprovedVenuesOnlyResponse {}

message ListVenuesRequest {
  string city_id = 1;
  VenueStatus status = 2;
  // Optional filters.
  string area_id = 3;
  string category_id = 4;
  // Places to skip, for the next page.
  int32 offset = 5;
}

message ListVenuesResponse {
  repeated Venue venues = 1;
  // How many places match, over all pages.
  int32 total = 2;
}

message Venue {
  string place_id = 1;
  // From Google, in English; "" without a Google Maps key or if it failed.
  string name = 2;
  string address = 3;
  string maps_url = 4;
  string area_id = 5;
  string area_name = 6;
  repeated string category_ids = 7;
  VenueStatus status = 8;
  // An admin added it (it wasn't discovered).
  bool added = 9;
  // Draft or open plans that use it.
  int32 plans = 10;
  // Why the name suggests a closer look, e.g. "snack bar?"; "" if nothing.
  string flag = 11;
  google.protobuf.Timestamp reviewed_at = 12;
}

message SetVenueStatusRequest {
  string city_id = 1;
  repeated string place_ids = 2;
  VenueStatus status = 3;
}

message SetVenueStatusResponse {
  // Places changed (ids not in the city are skipped).
  int32 changed = 1;
}

message SearchVenuesRequest {
  string city_id = 1;
  // "" = every area of the city.
  string area_id = 2;
  // e.g. "スナック" or a place's name.
  string query = 3;
}

message SearchVenuesResponse {
  repeated FoundVenue venues = 1;
  // Google searches made (one per area).
  int32 searches = 2;
}

message FoundVenue {
  string place_id = 1;
  // From Google, in English (shown, never stored).
  string name = 2;
  string address = 3;
  string maps_url = 4;
  // The nearest of the city's areas.
  string area_id = 5;
  string area_name = 6;
  // Whether the city already has it, and in which categories.
  bool known = 7;
  VenueStatus status = 8;
  repeated string category_ids = 9;
  // Categories it could be added in (its Google types fit and it's near
  // enough); empty when it's known or fits none.
  repeated string addable_category_ids = 10;
  string flag = 11;
  // Closed for good or for now: it can't be added.
  bool closed = 12;
}

message AddVenueRequest {
  string city_id = 1;
  string place_id = 2;
  string category_id = 3;
}

message AddVenueResponse {
  string area_id = 1;
}
