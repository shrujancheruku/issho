syntax = "proto3";

package issho.v1;

import "google/protobuf/timestamp.proto";
import "issho/v1/access.proto";

// A member's own outings: the groups matching formed that they have a seat in
// (docs/spec/outings.md). An outing is private to the people in it, so there is
// no RPC names a person, and one that names an outing only acts on the caller's
// own seat in it: a caller is only ever shown their own seats, and what they see
// of the others is a count of yeses and, once going, first names.
service OutingService {
  // Lists the caller's own outings, earliest date first: each one they have a
  // seat in, with the date, the time and the languages the group shares, and
  // where their seat stands. Member: it takes no account and no outing id, so
  // it can only ever return the caller's own, and an outing the caller has no
  // seat in is never in it. It never returns a name or the id of another
  // person except the first names of the others going, and those only to a
  // person who is going themselves.
  rpc ListMyOutings(ListMyOutingsRequest) returns (ListMyOutingsResponse) {
    option (issho.v1.access) = ACCESS_MEMBER;
  }

  // Says yes or no to the caller's own invitation. It is open for a fixed 48
  // hours from the invitation (FAILED_PRECONDITION after that, or when the
  // outing was not set, or for a no from someone already going: they cancel).
  // A no can be changed to a yes inside the 48 hours. A yes is held until 3 have
  // said yes, which sets the outing and makes everyone who said yes going; a yes
  // after that is going at once. Member: the seat is the caller's own, and an
  // outing the caller has no seat in is NOT_FOUND, as is one that doesn't exist.
  rpc AnswerInvitation(AnswerInvitationRequest) returns (AnswerInvitationResponse) {
    option (issho.v1.access) = ACCESS_MEMBER;
  }

  // Cancels the caller's own seat, which must be going: the seat records it as
  // cancelled. FAILED_PRECONDITION for a seat that is not going, NOT_FOUND for an
  // outing the caller has no seat in. Member.
  rpc CancelSeat(CancelSeatRequest) returns (CancelSeatResponse) {
    option (issho.v1.access) = ACCESS_MEMBER;
  }

  // "I'm here": one tap, no proof of place, for the caller's own seat, which must
  // be going. Open from 30 minutes before the start to the plan's stated end on
  // the city's clock: FAILED_PRECONDITION outside it and for a seat that is not
  // going; NOT_FOUND for an outing the caller has no seat in. Checking in again
  // changes nothing. Once checked in there is no cancel. Returns the outing as
  // the caller sees it, with the first names of the others who have checked in.
  // Member.
  rpc CheckIn(CheckInRequest) returns (CheckInResponse) {
    option (issho.v1.access) = ACCESS_MEMBER;
  }

  // The caller's feedback form for an outing: who else was going at the start
  // (each ticked by default) and the caller's answers so far. Open from the
  // plan's stated end for 7 days, to a person who was going at the start:
  // FAILED_PRECONDITION before it opens, after it closes, and for a seat that was
  // not going at the start; NOT_FOUND for an outing the caller has no seat in.
  // The others are named by first name and a handle that means something only
  // inside this outing, never by an account, an email or a surname. Member.
  rpc GetFeedback(GetFeedbackRequest) returns (GetFeedbackResponse) {
    option (issho.v1.access) = ACCESS_MEMBER;
  }

  // Answers feedback's first three questions for the caller's own seat, replacing
  // any answers given before; open as GetFeedback is, so answers can be changed
  // until it closes. A "no" to "did you go?" ends the feedback there: nothing
  // after it is kept. INVALID_ARGUMENT for a handle that is none of the others
  // who were going at the start, or a pick of someone the same answer says was
  // not there. A pick is private: no RPC tells the person picked, or anyone
  // else. Member.
  rpc SaveFeedback(SaveFeedbackRequest) returns (SaveFeedbackResponse) {
    option (issho.v1.access) = ACCESS_MEMBER;
  }
}

message ListMyOutingsRequest {}

message ListMyOutingsResponse {
  repeated Outing outings = 1;
}

message AnswerInvitationRequest {
  string outing_id = 1;
  InvitationAnswer answer = 2;
}

// The outing as the caller's seat sees it after answering.
message AnswerInvitationResponse {
  Outing outing = 1;
}

// The two replies to an invitation.
enum InvitationAnswer {
  INVITATION_ANSWER_UNSPECIFIED = 0;
  INVITATION_ANSWER_YES = 1;
  INVITATION_ANSWER_NO = 2;
}

message CancelSeatRequest {
  string outing_id = 1;
}

// The outing as the caller's seat sees it after cancelling.
message CancelSeatResponse {
  Outing outing = 1;
}

message CheckInRequest {
  string outing_id = 1;
}

// The outing as the caller's seat sees it after checking in.
message CheckInResponse {
  Outing outing = 1;
}

message GetFeedbackRequest {
  string outing_id = 1;
}

message GetFeedbackResponse {
  Feedback feedback = 1;
}

message SaveFeedbackRequest {
  string outing_id = 1;
  // Question 1, "did you go?". A false ends the feedback there: the other
  // fields are ignored and nothing after it is kept.
  bool went = 2;
  // Question 2, "who else was there?": everyone going at the start is ticked by
  // default, so these are the handles of the people the caller says were not
  // there.
  repeated string not_there = 3;
  // Question 5, "who would you meet again?": the handles of the people the caller
  // would. Each is a pick, private to the caller.
  repeated string meet_again = 4;
}

message SaveFeedbackResponse {
  Feedback feedback = 1;
}

// The caller's feedback form for one outing.
message Feedback {
  string outing_id = 1;
  // Whether the caller has answered "did you go?" yet; went is that answer and
  // means nothing before it.
  bool answered = 2;
  bool went = 3;
  // Everyone who was going at the start but the caller, by first name and then
  // handle.
  repeated Companion others = 4;
  // The caller's own answers, as handles, sorted.
  repeated string not_there = 5;
  repeated string meet_again = 6;
  // When feedback closes: 7 days after the plan's stated end.
  google.protobuf.Timestamp closes_at = 7;
}

// Another person of an outing as feedback names them. A handle is random, means
// nothing outside this outing and is not an account or anything that links to
// one; a first name is all that is ever shown of another person.
message Companion {
  string handle = 1;
  string first_name = 2;
}

// An outing as its own seat's holder sees it. It carries no other person.
message Outing {
  string id = 1;
  // The plan the outing is for.
  string plan_id = 2;
  // The city's calendar date, "YYYY-MM-DD".
  string date = 3;
  // "morning", "afternoon" or "evening", the part of the day the group ticked.
  string part = 4;
  // The plan's start on that date, "HH:MM" on the city's clock.
  string starts_at = 5;
  // Every language the whole group speaks, as codes ("vi", "en"), sorted: the
  // invitation names them all.
  repeated string languages = 6;
  // Where the caller's seat stands.
  SeatState seat_state = 7;
  // When the caller's invitation went out, and when its fixed 48 hours end.
  google.protobuf.Timestamp invited_at = 8;
  google.protobuf.Timestamp invitation_ends_at = 9;
  // Where the whole outing stands.
  OutingState outing_state = 10;
  // How many have said yes: those going and those whose yes waits for the
  // outing to be set. A count, never who, shown to everyone with a seat.
  int32 yes_count = 11;
  // The first names of the others going, sorted: the caller's own is not in it,
  // and it is empty unless the caller is going themselves. A first name is all
  // that is ever shown of another person.
  repeated string others_going = 12;
  // Whether the caller has checked in, and when.
  bool checked_in = 13;
  google.protobuf.Timestamp checked_in_at = 14;
  // The first names of the others who have checked in, sorted: only to a person
  // who is going themselves, never their own.
  repeated string checked_in_names = 15;
  // Check-in opens 30 minutes before the start and closes at the plan's stated
  // end, on the city's clock; feedback opens at that end and closes 7 days later.
  google.protobuf.Timestamp check_in_opens_at = 16;
  google.protobuf.Timestamp check_in_closes_at = 17;
  google.protobuf.Timestamp feedback_opens_at = 18;
  google.protobuf.Timestamp feedback_closes_at = 19;
}

// An outing's state (docs/spec/outings.md, "What an outing is"). Only offered,
// set and not set are made so far.
enum OutingState {
  OUTING_STATE_UNSPECIFIED = 0;
  OUTING_STATE_PROPOSED = 1;
  // Its invitations are out and fewer than 3 have said yes.
  OUTING_STATE_OFFERED = 2;
  // At least 3 have said yes.
  OUTING_STATE_SET = 3;
  OUTING_STATE_OVER = 4;
  // Fewer than 3 had said yes when the invitations' 48 hours ended.
  OUTING_STATE_NOT_SET = 5;
  OUTING_STATE_CANCELLED = 6;
}

// A seat's state: the person's stage in the outing, or how they left it
// (docs/spec/outings.md, "What an outing is").
enum SeatState {
  SEAT_STATE_UNSPECIFIED = 0;
  // A date is set and the person has 48 hours to say yes or no.
  SEAT_STATE_INVITED = 1;
  SEAT_STATE_GOING = 2;
  SEAT_STATE_DECLINED = 3;
  SEAT_STATE_UNANSWERED = 4;
  SEAT_STATE_FULL = 5;
  SEAT_STATE_CANCELLED = 6;
  SEAT_STATE_LATE_CANCEL = 7;
  SEAT_STATE_REMOVED = 8;
  // Said yes, and the outing is not set yet: the yes waits for the third.
  SEAT_STATE_ACCEPTED = 9;
}
