syntax = "proto3";

package issho.v1;

option go_package = "github.com/shrujancheruku/issho/backend/gen/issho/v1;isshov1";

// IdentityService manages the signed-in user's app account.
// Authentication itself is handled by Supabase Auth; every call must send
// `Authorization: Bearer <Supabase access token>`.
//
// HTTP: POST /issho.v1.IdentityService/<Method>
service IdentityService {
  // GetMe returns the caller's account, creating the app-side user row the
  // first time a Supabase user calls the API. It works for suspended
  // accounts too (User.suspended), so the app can say so.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}

  // DeleteAccount permanently deletes the caller's Supabase auth user and all
  // of their app data (cascaded from auth.users). The client should sign out
  // afterwards; existing access tokens stop working once they expire.
  // Returns FAILED_PRECONDITION if the server has no Supabase secret key configured.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {}
}

message DeleteAccountRequest {}

message DeleteAccountResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message User {
  // Same UUID as the Supabase auth user (auth.users.id).
  string id = 1;
  // Email from the Supabase token; empty for providers that hide it.
  string email = 2;
  // True once the user has completed onboarding (has a profile).
  bool onboarded = 3;
  // Display languages from the profile (empty until onboarded), so the app
  // can show itself in the right languages straight after GetMe.
  string primary_language = 4;
  string secondary_language = 5;
  // A moderator has suspended the account. Every other call is refused
  // (PERMISSION_DENIED) except signing out and DeleteAccount; the app
  // shows that it's suspended.
  bool suspended = 6;
}
