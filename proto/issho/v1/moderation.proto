syntax = "proto3";

package issho.v1;

import "google/protobuf/timestamp.proto";
import "issho/v1/crews.proto";
import "issho/v1/events.proto";

option go_package = "github.com/shrujancheruku/issho/backend/gen/issho/v1;isshov1";

// ModerationService: the moderation queue in the admin SPA. Reports about
// people, flags raised by the system (picks leaning towards one gender),
// why people left crews, and corrections to machine translations.
// Admins only: requires `Authorization: Bearer <Supabase access token>` for
// an account with `app_metadata.admin = true` (set with `tool set-admin`);
// anyone else gets PERMISSION_DENIED.
//
// HTTP: POST /issho.v1.ModerationService/<Method>
service ModerationService {
  // GetModerator says who the caller is. The admin SPA calls it after
  // sign-in to find out whether the account is an admin.
  rpc GetModerator(GetModeratorRequest) returns (GetModeratorResponse) {}

  // ListReports returns reports, open ones first (oldest first), then the
  // rest newest first. At most 200.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse) {}

  // ResolveReport records the decision on a report. It can be changed
  // later (resolve again). The pair stays apart in matching either way.
  rpc ResolveReport(ResolveReportRequest) returns (ResolveReportResponse) {}

  // ListFlags returns open flags (oldest first) or resolved ones (newest
  // first). At most 200.
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse) {}

  // ResolveFlag closes an open flag with a note. FAILED_PRECONDITION if
  // it's already resolved. A later signal opens a new flag.
  rpc ResolveFlag(ResolveFlagRequest) returns (ResolveFlagResponse) {}

  // ListCrewLeaves returns why people left crews, newest first. At most 200.
  rpc ListCrewLeaves(ListCrewLeavesRequest) returns (ListCrewLeavesResponse) {}

  // ListTranslationLanguages returns the languages with machine
  // translations, with how many still need a look.
  rpc ListTranslationLanguages(ListTranslationLanguagesRequest) returns (ListTranslationLanguagesResponse) {}

  // ListTranslations returns one language's translations, unreviewed ones
  // first, 100 at a time.
  rpc ListTranslations(ListTranslationsRequest) returns (ListTranslationsResponse) {}

  // ReviewTranslation corrects (or confirms) a translation. A reviewed
  // translation is never replaced by a machine one. INVALID_ARGUMENT if
  // the text drops or adds a {placeholder} of the English source.
  rpc ReviewTranslation(ReviewTranslationRequest) returns (ReviewTranslationResponse) {}

  // SearchPeople finds people by name or email (contains, any case) or
  // exact user id. At most 50.
  rpc SearchPeople(SearchPeopleRequest) returns (SearchPeopleResponse) {}

  // GetPerson returns what a moderator needs to decide about someone:
  // who they are, report counts, flags, suspensions and recent outings.
  // NOT_FOUND if there's no such account.
  rpc GetPerson(GetPersonRequest) returns (GetPersonResponse) {}

  // SuspendPerson keeps someone out of Issho until it's lifted: the API
  // refuses their calls (GetMe says they're suspended; signing out and
  // deleting the account still work), the chat socket refuses them,
  // matching leaves them out and they get no notifications. They're also
  // taken out of their open signups, outings that haven't started, and
  // crews. Suspending someone already suspended only repeats that
  // removal. INVALID_ARGUMENT for the caller's own account.
  rpc SuspendPerson(SuspendPersonRequest) returns (SuspendPersonResponse) {}

  // LiftSuspension ends someone's suspension. They can use Issho again,
  // but aren't put back into what they were taken out of.
  // FAILED_PRECONDITION if they aren't suspended.
  rpc LiftSuspension(LiftSuspensionRequest) returns (LiftSuspensionResponse) {}

  // ListSuspended returns everyone suspended now, most recent first. At
  // most 200.
  rpc ListSuspended(ListSuspendedRequest) returns (ListSuspendedResponse) {}
}

message GetModeratorRequest {}

message GetModeratorResponse {
  string user_id = 1;
  string email = 2;
}

enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  // Waiting for a moderator.
  REPORT_STATUS_OPEN = 1;
  // A moderator acted on it (see the note).
  REPORT_STATUS_ACTIONED = 2;
  // A moderator looked and took no action.
  REPORT_STATUS_DISMISSED = 3;
}

message ListReportsRequest {
  // UNSPECIFIED = every status.
  ReportStatus status = 1;
  // Only reports about this person; empty = everyone.
  string reported_id = 2;
}

message ListReportsResponse {
  repeated ModerationReport reports = 1;
}

message ModerationReport {
  string id = 1;
  // Empty if the reporter has deleted their account.
  string reporter_id = 2;
  string reporter_name = 3;
  string reported_id = 4;
  string reported_name = 5;
  // How many reports there are about the reported person in all.
  int32 reports_about_reported = 6;
  ReportReason reason = 7;
  string details = 8;
  ReportStatus status = 9;
  // The moderator's note on the decision.
  string note = 10;
  // Where they met: an outing (event_*) or a crew (crew_*), if still there.
  string event_id = 11;
  string event_title = 12;
  // The outing's date (YYYY-MM-DD, in the city's time zone) and part of the
  // day (morning, afternoon, evening).
  string event_date = 13;
  string event_block = 14;
  string crew_id = 15;
  string crew_name = 16;
  google.protobuf.Timestamp created_at = 17;
  // Last changed by the reporter (reporting again about the same outing or
  // crew). Later than reviewed_at: changed since the decision.
  google.protobuf.Timestamp updated_at = 18;
  google.protobuf.Timestamp reviewed_at = 19;
  string reviewed_by = 20;
}

message ResolveReportRequest {
  string report_id = 1;
  // ACTIONED, DISMISSED, or OPEN to reopen it.
  ReportStatus status = 2;
  // Up to 2000 characters.
  string note = 3;
}

message ResolveReportResponse {}

enum FlagKind {
  FLAG_KIND_UNSPECIFIED = 0;
  // Their meet-again picks lean heavily towards one gender, compared with
  // who they met. Details: gender, picked (picks of that gender), picks,
  // met (people met), met_share (that gender's share of the people they
  // met), p_value (how likely if picks ignored gender).
  FLAG_KIND_PICK_GENDER_LEAN = 1;
}

message ListFlagsRequest {
  // false = open flags; true = resolved ones.
  bool resolved = 1;
}

message ListFlagsResponse {
  repeated ModerationFlag flags = 1;
}

message ModerationFlag {
  int64 id = 1;
  string user_id = 2;
  string user_name = 3;
  FlagKind kind = 4;
  // The numbers behind the flag, as JSON (see FlagKind).
  string details_json = 5;
  // The note left when it was resolved.
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
  // The details were last refreshed (the flag is updated while open).
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp resolved_at = 9;
  string resolved_by = 10;
}

message ResolveFlagRequest {
  int64 flag_id = 1;
  // Up to 2000 characters.
  string note = 2;
}

message ResolveFlagResponse {}

message ListCrewLeavesRequest {
  // UNSPECIFIED = every reason.
  LeaveReason reason = 1;
}

message ListCrewLeavesResponse {
  repeated CrewLeave leaves = 1;
}

message CrewLeave {
  int64 id = 1;
  string crew_id = 2;
  // "Football" or "Kichijoji": what the crew shares.
  string crew_name = 3;
  // offered, active, lapsed or closed.
  string crew_status = 4;
  // Empty if they've deleted their account.
  string user_id = 5;
  string user_name = 6;
  LeaveReason reason = 7;
  string details = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListTranslationLanguagesRequest {}

message ListTranslationLanguagesResponse {
  repeated TranslationLanguage languages = 1;
}

message TranslationLanguage {
  // ISO 639-1 code, e.g. "ja".
  string lang = 1;
  int32 total = 2;
  int32 unreviewed = 3;
}

message ListTranslationsRequest {
  string lang = 1;
  bool unreviewed_only = 2;
  // Matches the English source or the translation; empty = all.
  string search = 3;
  // How many to skip (pages of 100).
  int32 offset = 4;
}

message ListTranslationsResponse {
  repeated Translation translations = 1;
}

message Translation {
  // Identifies the English source and its context, with lang.
  string source_hash = 1;
  string lang = 2;
  string source = 3;
  // What the text is ("name of a city", a UI string), as given to the
  // translator.
  string context = 4;
  string text = 5;
  // Which translator wrote it.
  string model = 6;
  bool reviewed = 7;
  google.protobuf.Timestamp reviewed_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ReviewTranslationRequest {
  string source_hash = 1;
  string lang = 2;
  // The corrected text (or the same text, to confirm it). Not empty.
  string text = 3;
}

message ReviewTranslationResponse {
  Translation translation = 1;
}

message SearchPeopleRequest {
  // At least 2 characters.
  string query = 1;
}

message SearchPeopleResponse {
  repeated PersonSummary people = 1;
}

message PersonSummary {
  string user_id = 1;
  // Empty if they haven't finished onboarding.
  string name = 2;
  string email = 3;
  bool suspended = 4;
}

message GetPersonRequest {
  string user_id = 1;
}

message GetPersonResponse {
  Person person = 1;
}

message Person {
  string user_id = 1;
  // Empty if they haven't finished onboarding (no profile).
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp joined_at = 4;
  // woman, man, nonbinary or unspecified; empty without a profile.
  string gender = 5;
  int32 birth_year = 6;
  // English name of their home area, and its city.
  string home_area = 7;
  string city_id = 8;
  // Reports about them (in all, and still open) and reports they made.
  int32 reports_about = 9;
  int32 open_reports_about = 10;
  int32 reports_made = 11;
  bool suspended = 12;
  // Newest first.
  repeated Suspension suspensions = 13;
  // Open ones first.
  repeated ModerationFlag flags = 14;
  // Newest first, at most 50.
  repeated PersonOuting outings = 15;
}

message Suspension {
  int64 id = 1;
  string reason = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset while it's in force.
  google.protobuf.Timestamp lifted_at = 5;
  string lifted_by = 6;
  string lift_note = 7;
}

message PersonOuting {
  string event_id = 1;
  string title = 2;
  // YYYY-MM-DD in the city's time zone, and morning, afternoon or evening.
  string date = 3;
  string block = 4;
  // scheduled, done or cancelled.
  string event_status = 5;
  // invited, confirmed, declined or dropped (confirmed, then cancelled).
  string response = 6;
  bool checked_in = 7;
  // Their feedback: SAID_WENT, SAID_DIDNT_GO, or UNSPECIFIED (none).
  OutingFeedback feedback = 8;
}

enum OutingFeedback {
  OUTING_FEEDBACK_UNSPECIFIED = 0;
  OUTING_FEEDBACK_SAID_WENT = 1;
  OUTING_FEEDBACK_SAID_DIDNT_GO = 2;
}

message SuspendPersonRequest {
  string user_id = 1;
  // Why, for moderators: 1-2000 characters. The person isn't shown it.
  string reason = 2;
}

message SuspendPersonResponse {}

message LiftSuspensionRequest {
  string user_id = 1;
  // Up to 2000 characters.
  string note = 2;
}

message LiftSuspensionResponse {}

message ListSuspendedRequest {}

message ListSuspendedResponse {
  repeated SuspendedPerson people = 1;
}

message SuspendedPerson {
  string user_id = 1;
  string name = 2;
  string reason = 3;
  google.protobuf.Timestamp since = 4;
  string suspended_by = 5;
}
