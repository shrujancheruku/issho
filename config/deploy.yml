# Kamal 2 deploy of the Go backend (M9): the API behind kamal-proxy and the
# River worker, both from backend/Dockerfile, on one VPS behind Cloudflare.
# Supabase stays hosted; nothing else runs on the server.
#
# The domain is joinissho.com (api.joinissho.com for the API); the server is
# a Google Compute Engine VM in Tokyo (issho-api, project issho-dev-512213).
# See docs/deploy.md for the one-time setup and the deploy steps.

service: issho

# GitHub Container Registry, under the repository's owner (private package).
# The deploy workflow created it (2026-10-26), so it's linked to the repository
# and the workflow's own token can push it; the older issho-backend package,
# pushed from a dev machine, isn't and can be deleted.
image: shrujancheruku/issho

servers:
  web:
    hosts:
      - 35.243.76.67 # GCE issho-api, asia-northeast1-b (static address)
  # The worker runs on the same server. It has no proxy: it serves no HTTP,
  # and River's leader election means a second worker would be safe but idle.
  worker:
    hosts:
      - 35.243.76.67
    cmd: worker
    proxy: false

proxy:
  host: api.joinissho.com # proxied by Cloudflare
  app_port: 8080
  # Cloudflare terminates TLS for clients and connects to the server over
  # HTTPS with a Cloudflare origin certificate (SSL mode "Full (strict)").
  # Let's Encrypt isn't used: its HTTP challenge is awkward behind
  # Cloudflare's proxy, and origin certificates last 15 years.
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT
    private_key_pem: CLOUDFLARE_ORIGIN_KEY
  healthcheck:
    # Answers 200 only when the database does (internal/health), so a deploy
    # with a broken DATABASE_URL never replaces a working container.
    path: /up
    interval: 2
    timeout: 5
  # Composing a walk in the admin's stop editor (Google, Gemini) can take
  # longer than the 30 s default.
  response_timeout: 60

# Compute Engine logs in as an ordinary user, not root: kamal, in the docker
# group (set up on first boot, docs/deploy.md).
ssh:
  user: kamal

registry:
  server: ghcr.io
  username: shrujancheruku
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: backend/Dockerfile
  # The repository root: the image needs data/ as well as backend/.
  # Without `context`, Kamal builds from a clean clone of the current commit,
  # which is what a deploy should ship; .dockerignore keeps the rest out.
  args:
    VERSION: <%= `git rev-parse --short HEAD`.strip %>

env:
  clear:
    API_ADDR: ":8080"
    # issho-dev for now (owner's decision, 2026-10-26: pre-release, only the
    # owner and testers); a production project in Tokyo before real users.
    SUPABASE_URL: https://yjnzrhusfxilktbjrzsw.supabase.co
    # The sites on joinissho.com, plus their workers.dev addresses while both work.
    ALLOWED_ORIGINS: https://admin.joinissho.com,https://app.joinissho.com,https://issho-admin.shrujancheruku.workers.dev,https://issho-web.shrujancheruku.workers.dev
    SENTRY_ENVIRONMENT: production
  secret:
    # A session-mode connection (direct or the session pooler), never the
    # transaction pooler: the API LISTENs for chat and the worker for River.
    - DATABASE_URL
    - SUPABASE_SECRET_KEY
    - GOOGLE_MAPS_API_KEY
    - GOOGLE_TRANSLATE_API_KEY
    - GOOGLE_GEMINI_API_KEY
    - GITHUB_TOKEN
    # Empty = no error reporting (internal/platform/sentry).
    - SENTRY_DSN
    - EXPO_ACCESS_TOKEN

accessories:
  # Nightly pg_dump to Cloudflare R2, an off-site copy (config/backup/backup.sh;
  # docs/deploy.md). The Postgres image matches the database's major version.
  backup:
    image: postgres:17-alpine
    host: 35.243.76.67
    cmd: sh /backup/backup.sh
    files:
      - config/backup/backup.sh:/backup/backup.sh
    env:
      clear:
        R2_ENDPOINT: https://b6f3e52f2491d38421018e275ef7896b.r2.cloudflarestorage.com
        R2_BUCKET: issho-backups # 30-day lifecycle rule
        BACKUP_AT: "18" # UTC hour: 03:00 in Tokyo, the quietest time for the main city
      secret:
        - DATABASE_URL
        - R2_ACCESS_KEY_ID
        - R2_SECRET_ACCESS_KEY

aliases:
  # kamal migrate: apply migrations with the image for the current commit
  # (after `kamal build push`, before `kamal deploy`; see docs/deploy.md).
  # --roles=web: both roles share the host, so --primary alone runs it once
  # per role, and two goose runs at once race on the same CREATE INDEX.
  migrate: app exec --primary --roles=web "tool migrate up"
  migrate-status: app exec --primary --roles=web "tool migrate status"
  logs-api: app logs --roles web -f
  logs-worker: app logs --roles worker -f
