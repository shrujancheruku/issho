# The dev destination (`kamal -d dev`): the values that name dev, merged over
# config/deploy.yml. Dev is the e2-micro `issho-dev` on Compute Engine
# (asia-southeast1-b) in the Google Cloud project `issho-dev-512213`, behind
# Cloudflare, running against the `issho-dev` Supabase project
# (docs/spec/operations.md#environments).
#
# DEPLOY_HOST is the VM's address, set by the deploy (scripts/deploy-dev.sh). It
# isn't written here: the repository is public and the VM answers only
# Cloudflare on 80 and 443.

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
  worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>

# The API has its own name. The Expo server (config/deploy.web.yml) forwards the
# API's paths on dev, and the admin's Worker on admin-dev, so a browser calls it
# on the page's own origin and the API needs no CORS. (Sharing dev's name by path
# in kamal-proxy was tried: it wants TLS on the root path's service.)
proxy:
  host: api-dev.joinissho.com
